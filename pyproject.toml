[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "montaj"
version = "2.6.2"
description = "Video editing toolkit for AI agents — CLI-first, agent-native, open source"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Sam Padilla", email = "sam@bycrux.com" },
]
keywords = ["video", "editing", "ai", "agent", "cli", "ffmpeg", "montaj"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "Pillow>=10.0",
    "yt-dlp>=2026.3",
    "curl_cffi>=0.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "watchdog>=4.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-timeout"]
rvm = ["torch>=2.0", "torchvision>=0.15", "av>=12.0"]
demucs = ["demucs>=4.0", "torch>=2.0", "torchaudio>=2.0"]
connectors = ["pyjwt>=2.8.0", "requests>=2.31.0", "google-genai>=0.3.0", "openai>=1.75.0"]

[project.urls]
Homepage = "https://github.com/theSamPadilla/montaj"
Repository = "https://github.com/theSamPadilla/montaj"
Issues = "https://github.com/theSamPadilla/montaj/issues"

[project.scripts]
montaj = "cli.main:main"
mtj    = "cli.main:main"

[tool.setuptools]
# Defer file selection to MANIFEST.in (graft render/ui, prune node_modules + ui/dist).
# Without this, only Python files would land in the wheel — render/ and ui/ source
# would be missing and `montaj install ui` would fail.
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "cli*", "serve*", "engine*", "project*", "lib*", "profiles*", "connectors*",
    # Bundled non-Python assets (Node render engine, Vite UI source, MCP server).
    "montaj_assets*",
    # Other data dirs ride along via include-package-data + MANIFEST.in.
    "steps*", "skills*", "workflows*", "schema*", "docs*",
]

[tool.setuptools.package-data]
# Per-package globs match files at the package root only (not recursively).
# Keep this broad so future *.json/*.yaml additions ship without a packaging
# diff. node_modules/ and ui/dist/ are already pruned by MANIFEST.in.
"*" = ["*.json", "*.yaml"]
# overlay-runtime is a Node bundle, not a Python package — its dir name has a
# hyphen and no __init__.py, so setuptools.packages.find skips it and its .js
# source falls out of the wheel. Force the whole subtree in via the parent
# package's data globs (node_modules/ is still pruned by MANIFEST.in).
"montaj_assets" = ["overlay-runtime/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
markers   = [
    "slow: tests that take more than a few seconds",
]
