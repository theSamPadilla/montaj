name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install montaj
        run: pip install -e ".[test]"
      - name: Run tests (fast suite)
        run: pytest -m "not slow" --timeout=300

  timeline-core:
    name: Timeline-core tests + typecheck (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: montaj_assets/timeline-core/package-lock.json
      - run: npm ci
        working-directory: montaj_assets/timeline-core
      - run: npm test
        working-directory: montaj_assets/timeline-core
      - run: npm run typecheck
        working-directory: montaj_assets/timeline-core

  render:
    name: Render engine tests (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          # render declares @bycrux/timeline-core: file:../timeline-core (SP2).
          # No path widening needed: render/package-lock.json already pins the
          # resolved shape of that dependency (it has zero runtime deps, so
          # there's nothing further to hash), and `npm ci` requires this
          # lockfile to exactly match render/package.json regardless — a
          # version bump that isn't reflected here fails npm ci outright, not
          # silently via a stale cache.
          cache-dependency-path: montaj_assets/render/package-lock.json
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
        working-directory: montaj_assets/render
      - run: node --test
        working-directory: montaj_assets/render

  mcp:
    name: MCP server tests (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: montaj_assets/mcp/package-lock.json
      - run: npm ci
        working-directory: montaj_assets/mcp
      - run: node --test
        working-directory: montaj_assets/mcp

  overlay-runtime:
    name: Overlay runtime tests (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: montaj_assets/overlay-runtime/package-lock.json
      - run: npm ci
        working-directory: montaj_assets/overlay-runtime
      - run: npm test
        working-directory: montaj_assets/overlay-runtime

  editor:
    name: Editor package tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: montaj_assets/editor/package-lock.json
      - run: npm ci
        working-directory: montaj_assets/editor
      - run: npm run lint
        working-directory: montaj_assets/editor
      - run: npm test
        working-directory: montaj_assets/editor

  ui:
    name: UI tests + typecheck/build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: montaj_assets/ui/package-lock.json
      # file: deps (../editor, ../overlay-runtime) need their trees installed too
      - run: npm ci
        working-directory: montaj_assets/ui
      - run: npm run test:run
        working-directory: montaj_assets/ui
      - run: npm run build
        working-directory: montaj_assets/ui

  wheel:
    name: Wheel packaging check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install build
      # sdist + wheel (NOT --wheel alone): the wheel-only form bypasses
      # MANIFEST.in pruning — see the warning at the top of scripts/build.sh.
      - run: python -m build
      - name: Verify wheel contents
        run: |
          set -euo pipefail
          whl=$(ls dist/*.whl)
          echo "Checking $whl"
          listing=$(unzip -l "$whl")
          # node_modules must never ship (MANIFEST.in prune regression guard)
          if echo "$listing" | grep -q node_modules; then
            echo "::error::node_modules leaked into the wheel"
            echo "$listing" | grep node_modules | head
            exit 1
          fi
          # internal docs (plans/ideas/fullsend) must never ship
          if echo "$listing" | grep -qE "docs/(plans|ideas|fullsend)/"; then
            echo "::error::internal docs leaked into the wheel"
            echo "$listing" | grep -E "docs/(plans|ideas|fullsend)/" | head
            exit 1
          fi
          # sanity: the render engine and step schemas must be present
          echo "$listing" | grep -q "montaj_assets/render/render.js"
          echo "$listing" | grep -q "steps/media/probe.json"
          # timeline-core must ship: cli/commands/install.py copies this dir into
          # the prod build cache, and render/ + editor/ declare it as a `file:`
          # dependency. If it's missing from the wheel, `montaj install` fails at
          # `npm install` with an unresolvable dependency.
          echo "$listing" | grep -q "montaj_assets/timeline-core/index.js"
          echo "$listing" | grep -q "montaj_assets/timeline-core/src/source-window.js"
          # luts/ must ship: `.cube` matches neither the `"*" = ["*.json"]`
          # package-data glob nor (pre-SP6b) any "montaj_assets" glob in
          # pyproject.toml, so it's the exact failure mode above — present in
          # the sdist, silently missing from the wheel. lib/look.py and
          # render/look.js both load these at runtime with no fallback.
          echo "$listing" | grep -q "montaj_assets/luts/montaj-vivid-v1.cube"
          echo "$listing" | grep -q "montaj_assets/luts/montaj-vivid-v1-neutral.cube"
          echo "$listing" | grep -q "montaj_assets/luts/looks.json"
          # the sdist ships to PyPI too — same gates
          sdist_listing=$(tar tzf dist/*.tar.gz)
          if echo "$sdist_listing" | grep -qE "docs/(plans|ideas|fullsend)/.|node_modules"; then
            echo "::error::internal docs or node_modules leaked into the sdist"
            exit 1
          fi

  windows:
    name: Windows portability smoke
    runs-on: windows-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: montaj_assets/render/package-lock.json
      - name: Install montaj
        run: pip install -e ".[test]"
      - name: Run Windows-portability + adjacent Python tests (fast suite)
        run: pytest tests/test_windows_portability.py tests/test_ffmpeg_static.py tests/test_render_supersede.py tests/test_server_files.py -m "not slow" --timeout=300
      - name: Install render engine deps
        run: npm ci
        working-directory: montaj_assets/render
      - name: Render engine portability unit tests (node --test)
        run: node --test test/file-url.test.mjs test/is-main.test.mjs test/ffmpeg-filter-path.test.mjs
        working-directory: montaj_assets/render
      - name: ffmpeg smoke — real download, filters/encoders, lut3d path escaping
        run: python tests/ci/windows_ffmpeg_smoke.py
      - name: pid-probe smoke — lib.proc.pid_alive across a real process boundary
        run: python tests/ci/windows_smoke.py
      - name: isMain smoke — node render.js --help through symlink-like path shapes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $render = Join-Path $env:GITHUB_WORKSPACE "montaj_assets\render\render.js"

          function Assert-Usage([string]$label, [string]$path) {
            Write-Host "--- $label : $path ---"
            $out = (& node $path --help 2>&1 | Out-String)
            Write-Host $out
            if ($out -notmatch "Usage: render\.js") {
              throw "[$label] expected 'Usage: render.js' in node's output, got: $out"
            }
            Write-Host "[$label] OK"
          }

          # 1. Plain checkout path — baseline.
          Assert-Usage "checkout path" $render

          # 2. Lower-cased drive letter (GITHUB_WORKSPACE's drive is upper-case).
          $lower = $render.Substring(0,1).ToLower() + $render.Substring(1)
          Assert-Usage "lower-cased drive letter" $lower

          # 3. mklink /J junction pointing at the render dir (mklink is a cmd
          #    builtin, not a pwsh one — shelled out via cmd /c).
          $renderDir = Join-Path $env:GITHUB_WORKSPACE "montaj_assets\render"
          $junction = Join-Path $env:RUNNER_TEMP "render-junction"
          cmd /c mklink /J $junction $renderDir
          if ($LASTEXITCODE -ne 0) { throw "mklink /J failed with exit $LASTEXITCODE" }
          Assert-Usage "mklink /J junction" (Join-Path $junction "render.js")

          # 4. subst drive mapped to the repo root.
          $substDrive = "T:"
          subst $substDrive $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "subst failed with exit $LASTEXITCODE" }
          try {
            Assert-Usage "subst drive" (Join-Path $substDrive "montaj_assets\render\render.js")
          } finally {
            subst $substDrive /D | Out-Null
          }

  windows-discovery:
    name: Windows full-suite discovery (non-blocking)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install montaj
        run: pip install -e ".[test]"
      - name: Run full suite (fast tests) — expected NOT green; failure list feeds later plans
        run: pytest -m "not slow" --timeout=300
