# publish-editor.yml
#
# MANUAL / TAG-GATED — this workflow is NOT part of normal CI.
# It runs only when a tag matching `editor-v*` is pushed (e.g. `editor-v0.1.0`).
# It publishes @devbycrux/editor to the public npm registry.
#
# To publish a new version:
#   1. Bump the version in montaj_assets/editor/package.json.
#   2. Commit and push the bump.
#   3. Tag the commit: git tag editor-v<version> && git push origin editor-v<version>
#   4. This workflow triggers automatically on that tag push.
#
# No manual dispatch is wired up intentionally — publishing requires a clean tag.
#
# NODE_AUTH_TOKEN must be set to an npm automation token (generated at
# https://www.npmjs.com/settings/<user>/tokens) stored as a repo secret named
# NPM_TOKEN. Do NOT use GITHUB_TOKEN here — that only works for GitHub Packages.

name: Publish @devbycrux/editor

on:
  push:
    tags:
      - 'editor-v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@devbycrux'

      - name: Install dependencies
        working-directory: montaj_assets/editor
        run: npm ci

      - name: Run tests
        working-directory: montaj_assets/editor
        run: npm test

      - name: Run lint
        working-directory: montaj_assets/editor
        run: npm run lint

      - name: Publish (idempotent — skips if the version is already on npm)
        working-directory: montaj_assets/editor
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@devbycrux/editor@$VERSION" version >/dev/null 2>&1; then
            echo "@devbycrux/editor@$VERSION is already published — skipping (likely released via scripts/release-editor.sh)."
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
